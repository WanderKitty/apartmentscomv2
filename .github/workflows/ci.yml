name: CI
on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: aptv2_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/aptv2_test
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/aptv2_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r typecheck
      # DB-backed suites share one aptv2_test database and each resets it;
      # concurrent packages race on DROP SCHEMA / CREATE EXTENSION. Serialize.
      - run: pnpm -r --workspace-concurrency=1 --if-present test
      - run: pnpm --filter @aptv2/web build
